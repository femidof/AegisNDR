extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  attributes/privacy:
    actions:
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: enduser.id
        action: delete
      - key: db.statement
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # Prometheus scrapes this endpoint over the internal local-data network.
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: hybrid_ndr_otel
    send_timestamps: true

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    # Traces are intentionally discarded: there is no OTLP, SaaS,
    # remote-write, vendor exporter, or stdout (debug) exporter in the
    # production pipeline. Span data is never written to container logs, so
    # nothing sensitive can leak through telemetry.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
