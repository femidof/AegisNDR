global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: hybrid-ndr

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: vector
    metrics_path: /metrics
    static_configs:
      - targets: [vector:9598]
        labels:
          role: ingestion

  - job_name: operations-agent
    metrics_path: /metrics
    static_configs:
      - targets: [operations-agent:9108]
        labels:
          role: customer-operations
    # The operations agent requires a scrape token whenever
    # OPERATIONS_METRICS_TOKEN is set (installer-generated); the value is
    # expanded from the Prometheus container environment.
    authorization:
      type: Bearer
      credentials: '${OPERATIONS_METRICS_TOKEN}'

  - job_name: otel-products
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:9464]
        labels:
          telemetry_scope: customer-local

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:8888]
        labels:
          telemetry_scope: customer-local

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels:
          role: product-state

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: [minio:9000]
        labels:
          role: object-storage
    # MinIO runs with MINIO_PROMETHEUS_AUTH_TYPE=private; minio-init writes the
    # generated scrape JWT into the shared prometheus-data volume.
    bearer_token_file: /prometheus-data/minio-prometheus.jwt

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://local-api:8080/healthz
          - http://dashboard:4173/healthz
          - http://operations-agent:9108/healthz
          - http://otel-collector:13133/
          - http://minio:9000/minio/health/ready
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: service-health-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [clickhouse:9000]
        labels:
          service: clickhouse
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: [grafana:3000]

rule_files:
  - /etc/prometheus/rules/*.yml
