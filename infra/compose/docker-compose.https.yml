services:
  # Production customer access is exclusively through the HTTPS ingress. The
  # base Compose file retains its published ports only for the explicit local
  # HTTP development workflow; !reset prevents those ports reaching a LAN.
  local-api:
    ports: !reset []
    environment:
      # The signing-key document is a trust anchor: fetch it only over the
      # verified TLS ingress, pinned to the customer CA, never plain HTTP.
      AUTH_JWKS_URL: https://${CUSTOMER_LAN_HOST:?CUSTOMER_LAN_HOST must be a trusted LAN hostname or IP}/oidc/jwks
      AUTH_JWKS_CA_FILE: /run/customer-tls/ca-cert.pem
    volumes:
      - ${HYBRID_NDR_TLS_CA_FILE:?HYBRID_NDR_TLS_CA_FILE is required}:/run/customer-tls/ca-cert.pem:ro

  dashboard:
    ports: !reset []
    environment:
      DASHBOARD_ALLOW_INSECURE_HTTP: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4173/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  grafana:
    ports: !reset []
    environment:
      GF_SERVER_ROOT_URL: ${DASHBOARD_PUBLIC_ORIGIN:?DASHBOARD_PUBLIC_ORIGIN must be the trusted HTTPS origin}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "31536000"
      GF_SECURITY_CONTENT_TYPE_PROTECTION: "true"
      GF_SECURITY_X_XSS_PROTECTION: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"

  ingress:
    profiles: [customer]
    image: nginx:1.28.0-alpine3.21
    environment:
      NGINX_ENVSUBST_FILTER: ^(CUSTOMER_LAN_HOST|DASHBOARD_PUBLIC_ORIGIN|LOGTO_PUBLIC_ENDPOINT)$$
      CUSTOMER_LAN_HOST: ${CUSTOMER_LAN_HOST:?CUSTOMER_LAN_HOST must be a trusted LAN hostname or IP}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:?DASHBOARD_PUBLIC_ORIGIN must be the trusted HTTPS origin}
      LOGTO_PUBLIC_ENDPOINT: ${LOGTO_PUBLIC_ENDPOINT:-https://identity.invalid}
    volumes:
      - ../ingress/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${HYBRID_NDR_TLS_CERT_FILE:?HYBRID_NDR_TLS_CERT_FILE is required}:/etc/nginx/tls/server-cert.pem:ro
      - ${HYBRID_NDR_TLS_KEY_FILE:?HYBRID_NDR_TLS_KEY_FILE is required}:/etc/nginx/tls/server-key.pem:ro
    networks: [operator-access]
    ports:
      - "${CUSTOMER_BIND_ADDRESS:-127.0.0.1}:80:8080"
      - "${CUSTOMER_BIND_ADDRESS:-127.0.0.1}:443:8443"
    depends_on:
      local-api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      grafana:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --quiet --spider --no-check-certificate --header="Host: $${CUSTOMER_LAN_HOST}" https://127.0.0.1:8443/_health/ingress'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
