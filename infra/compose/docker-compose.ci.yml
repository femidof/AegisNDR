# Test-only source builds. Production release images remain independently pinned.
services:
  clickhouse:
    volumes:
      - ../clickhouse/ci-retention.sql:/docker-entrypoint-initdb.d/002-ci-retention.sql:ro
  operations-agent:
    environment:
      CLICKHOUSE_EVENT_RETENTION_DAYS: "3650"
  minio:
    image: hybrid-ndr-ci/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/compose/minio-ci.Dockerfile
      args:
        COMPONENT: minio
        RELEASE: RELEASE.2025-04-22T22-12-26Z
  minio-init:
    image: hybrid-ndr-ci/mc:RELEASE.2025-04-16T18-13-26Z
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/compose/minio-ci.Dockerfile
      args:
        COMPONENT: mc
        RELEASE: RELEASE.2025-04-16T18-13-26Z
