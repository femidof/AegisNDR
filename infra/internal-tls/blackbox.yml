modules:
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      tls: true
      tls_config:
        ca_file: /run/internal-tls/ca-cert.pem

  http_2xx:
    prober: http
    timeout: 5s
    http:
      tls_config:
        ca_file: /run/internal-tls/ca-cert.pem
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
