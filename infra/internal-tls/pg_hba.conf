# Internal data-plane access control for the customer deployment.
#
# TCP connections to PostgreSQL require verified TLS (hostssl only); the
# plaintext `host` rules are deliberately absent so a credential-bearing
# connection cannot silently downgrade. Local socket access (healthchecks,
# image entrypoint scripts) remains available.
local   all             all                                     trust
hostssl all             all             all                     scram-sha-256
