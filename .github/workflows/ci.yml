name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Sites worker tests
        run: npm run test:sites

      - name: Dashboard frontend tests
        run: npm run test:dashboard

      - name: Cloud portal tests
        run: npm run test:cloud-portal

  backend:
    name: Backend unit and installer tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/compose/python-requirements.txt

      - name: Install pinned backend dependencies
        run: python3 -m pip install --requirement infra/compose/python-requirements.txt

      - name: Python unit and integration discovery
        env:
          PYTHONPATH: packages/contracts-python:packages/redaction:packages/audit:packages/auth:packages/storage:packages/transport:packages/observability:services/detection-engine:services/operations-agent:services/deployment-connector:services/model-gateway:services/agent-runtime:apps/local-api:apps/control-api
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hybrid-ndr-pycache
        run: |
          python3 -m compileall -q apps/local-api apps/control-api packages services
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s tests/backend -p 'test_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_*.py'

  response-enforcement:
    name: Isolated Linux response acceptance
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify enforcement, recovery and kernel expiration
        run: bash scripts/test-response-enforcement.sh

  survivable-ops:
    name: Offline resilience container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: backend
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run the offline resilience acceptance gate
        env:
          COMPOSE_TEST_OVERRIDE: infra/compose/docker-compose.ci.yml
          COMPOSE_PROJECT_NAME: aegis-production-ci-${{ github.run_id }}
        run: bash scripts/test-offline-resilience.sh

      - name: Verify production persistence TLS and supervised response worker
        env:
          ENV_FILE: infra/compose/.env.example
          COMPOSE_TEST_OVERRIDE: infra/compose/docker-compose.ci.yml
          COMPOSE_PROJECT_NAME: aegis-production-ci-${{ github.run_id }}
          RESPONSE_ACCEPTANCE: "1"
        run: bash scripts/test-internal-tls.sh
